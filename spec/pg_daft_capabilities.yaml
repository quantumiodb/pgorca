schema_version: 1
registry_version: 1
generated_files_must_not_be_edited: true

source_lock:
  postgres19: 7873db5369b967dd53984df34fd800003410d04f
  pg_orca: 55339728f8987ff351d3e88e033a0dc3be78465f
  daft: b2fba655a96fe8f2cc5c21915ddc81dbe9610d3a

protocol:
  ir_major: 1
  ir_minor: 0
  abi_major: 1
  abi_minor: 1
  cost_model_version: 1

status_values:
  - ORCA_EQUIVALENT
  - PORTED_XFORM
  - CBO_PHYSICAL_ALT
  - DAFT_LOWERING_ONLY
  - NOT_APPLICABLE
  - BLOCKED

runtime_policy:
  default_enabled: false
  enable_requires_differential_test: true
  unknown_is_reject: true
  digest_algorithm: sha256
  registry_row_is_not_runtime_bit: true
  optimizer_rules_may_have_runtime_bits: false
  reserved_runtime_bits_must_be_zero: true

# These bits report reusable runtime prerequisites and execution entry points.
# They are not one-per-row aliases for the registry below. A registry entry may
# require zero or more bits, and the same bit may be shared by many entries.
runtime_capability_bits:
  - {bit: 0, id: PLAN_V1, initial_enabled: true}
  - {bit: 1, id: ARROW_C_DATA_V1, initial_enabled: true}
  - {bit: 2, id: EMBEDDED_SWORDFISH, initial_enabled: true}
  - {bit: 3, id: PG_OWNED_SOURCE, initial_enabled: true}
  - {bit: 4, id: PROJECT, initial_enabled: true}
  - {bit: 5, id: LIMIT, initial_enabled: true}
  - {bit: 6, id: FILTER, initial_enabled: true}
  - {bit: 7, id: HASH_JOIN, initial_enabled: true}
  - {bit: 8, id: HASH_AGGREGATE, initial_enabled: true}
  - {bit: 9, id: SORT, initial_enabled: true}
  - {bit: 10, id: TOP_N, initial_enabled: true}
  - {bit: 11, id: SPILL, initial_enabled: false}
  - {bit: 12, id: EXTERNAL_PARQUET_SCAN, initial_enabled: false}
  - {bit: 13, id: ARROW_FLIGHT_SIDECAR, initial_enabled: false}
  - {bit: 14, id: PROVIDER_TRANSFORMERS, initial_enabled: false}
  - {bit: 15, id: PROVIDER_OPENAI, initial_enabled: false}
  - {bit: 16, id: PROVIDER_LM_STUDIO, initial_enabled: false}
  - {bit: 17, id: PROVIDER_GOOGLE, initial_enabled: false}
  - {bit: 18, id: PROVIDER_VLLM, initial_enabled: false}

