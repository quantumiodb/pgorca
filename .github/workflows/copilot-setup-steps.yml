name: copilot-setup-steps

# Prepares the environment the GitHub Copilot coding agent works in.  The job
# must be named `copilot-setup-steps`; Copilot only honours `steps`,
# `permissions`, `runs-on`, `services`, `snapshot` and `timeout-minutes`
# (no `container:`), so dependencies are installed directly on the runner.
#
# The triggers below only exist so the workflow can be validated in Actions;
# Copilot runs the job itself before each agent session.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Add PostgreSQL apt repository (pgdg)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

      - name: Install build and test dependencies
        # postgresql-18 provides initdb/postgres for pg_regress --temp-instance;
        # pg_regress itself ships in postgresql-server-dev-18 (pgxs).
        run: |
          set -eux
          sudo apt-get install -y \
            postgresql-18 \
            postgresql-server-dev-18 \
            libxerces-c-dev \
            cmake \
            ninja-build \
            libipc-run-perl \
            gdb
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          set -eux
          /usr/lib/postgresql/18/bin/pg_config --version
          cmake --version
          ninja --version
          gcc --version

      - name: Pre-build and install pg_orca
        # Leave a warm Debug build in build/ so the agent only needs
        # incremental rebuilds.
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          cmake --build build -j "$(nproc)"
          sudo cmake --install build
